name: Swiggy Instamart Keyword Deal Hunter

on:
  schedule:
    # Wakes up at minute 27 UTC between 04:27 and 16:27 UTC (09:57 AM to 09:57 PM IST), plus 18:27 UTC (11:57 PM IST).
    # The runners boot up early (~30-40s), then syncToHourMark waits until :00:00 IST sharp (10:00 AM - 10:00 PM IST + 12:00 AM midnight IST).
    - cron: '27 4-16,18 * * *'
  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip top-of-hour wait sync (run immediately)'
        type: boolean
        required: false
        default: false

jobs:
  hunt:
    name: Worker (${{ matrix.worker }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker: [essentials, treats, lifestyle, beverages, personal]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'swiggy-telegram-bot/package-lock.json'

      - name: Install Dependencies
        working-directory: swiggy-telegram-bot
        run: npm ci || npm install

      - name: Restore Deal Cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: deal-cache-${{ matrix.worker }}-${{ github.run_id }}
          restore-keys: |
            deal-cache-${{ matrix.worker }}-

      - name: Run ${{ matrix.worker }} Deal Hunter
        working-directory: swiggy-telegram-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SWIGGY_STORE_ID: ${{ secrets.SWIGGY_STORE_ID }}
          SWIGGY_PRIMARY_STORE_ID: ${{ secrets.SWIGGY_PRIMARY_STORE_ID }}
          SWIGGY_SECONDARY_STORE_ID: ${{ secrets.SWIGGY_SECONDARY_STORE_ID }}
          SWIGGY_COOKIE: ${{ secrets.SWIGGY_COOKIE }}
          ESSENTIALS_MIN_DISCOUNT: ${{ secrets.ESSENTIALS_MIN_DISCOUNT }}
          TREATS_MIN_DISCOUNT: ${{ secrets.TREATS_MIN_DISCOUNT }}
          LIFESTYLE_MIN_DISCOUNT: ${{ secrets.LIFESTYLE_MIN_DISCOUNT }}
          BEVERAGES_MIN_DISCOUNT: ${{ secrets.BEVERAGES_MIN_DISCOUNT }}
          PERSONAL_MIN_DISCOUNT: ${{ secrets.PERSONAL_MIN_DISCOUNT }}
          USE_BROWSER: 'false'
          SKIP_SYNC: ${{ inputs.skip_sync }}
        run: |
          EXTRA_FLAGS=""
          if [ "$SKIP_SYNC" = "true" ]; then
            EXTRA_FLAGS="--skip-sync"
          fi
          echo "Executing Deal Hunter Worker: ${{ matrix.worker }}..."
          node src/cron-runner.js ${{ matrix.worker }} $EXTRA_FLAGS

      - name: Save Deal Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: swiggy-telegram-bot/data
          key: deal-cache-${{ matrix.worker }}-${{ github.run_id }}
